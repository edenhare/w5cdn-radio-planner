name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    name: Contributor License Agreement Check
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          (github.event_name == 'issue_comment' &&
           github.event.issue.pull_request &&
           (github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/edenhare/w5cdn-radio-planner/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'edenhare,dependabot[bot]'
          custom-notsigned-prcomment: >-
            Thank you for your pull request and interest in contributing to **W5CDN RadioPlanner**!
            Before we can merge your contribution, please read our [Contributor License Agreement (CLA)](https://github.com/edenhare/w5cdn-radio-planner/blob/main/CLA.md)
            and sign it by posting a new comment on this PR containing the exact text:

            `I have read the CLA Document and I hereby sign the CLA`
          custom-allsigned-prcomment: '✅ All contributors have signed the W5CDN RadioPlanner CLA.'
