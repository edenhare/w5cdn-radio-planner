name: CLA Assistant

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  CLAAssistant:
    name: Contributor License Agreement Check
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA') ||
        github.event.comment.body == 'recheck'))
    runs-on: ubuntu-latest
    steps:
      - name: Verify or record CLA signature
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const CLA_BRANCH = 'cla-signatures';
            const CLA_PATH = 'signatures/version1/cla.json';
            const CLA_DOC_URL = `https://github.com/${owner}/${repo}/blob/main/CLA.md`;
            const SIGN_PHRASE = 'I have read the CLA Document and I hereby sign the CLA';
            const MARKER = '<!-- radioplanner-cla-assistant -->';
            const ALLOWLIST = new Set([
              owner.toLowerCase(),
              'edenhare',
              'dependabot[bot]',
              'github-actions[bot]',
            ]);

            const prNumber = context.payload.pull_request
              ? context.payload.pull_request.number
              : context.payload.issue.number;

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (pr.state !== 'open') {
              core.info(`PR #${prNumber} is ${pr.state}; skipping CLA check.`);
              return;
            }

            // Load existing CLA signatures from cla-signatures branch
            let claData = { signedContributors: [] };
            let fileSha = null;
            try {
              const { data: file } = await github.rest.repos.getContent({
                owner,
                repo,
                path: CLA_PATH,
                ref: CLA_BRANCH,
              });
              if (file && file.content) {
                fileSha = file.sha;
                const decoded = Buffer.from(file.content, 'base64').toString('utf8');
                const parsed = JSON.parse(decoded);
                if (parsed && Array.isArray(parsed.signedContributors)) {
                  claData = parsed;
                }
              }
            } catch (err) {
              if (!err || err.status !== 404) {
                throw err;
              }
            }

            const signedSet = new Set(
              claData.signedContributors
                .map((entry) => String(entry.name || '').toLowerCase())
                .filter(Boolean)
            );

            // Record signature if triggered by a signing comment
            let newlySigned = false;
            if (context.eventName === 'issue_comment') {
              const body = String(context.payload.comment?.body || '').trim();
              const commenter = String(context.payload.comment?.user?.login || '').trim();
              const commenterId = context.payload.comment?.user?.id || 0;
              if (
                commenter &&
                body.toLowerCase().includes(SIGN_PHRASE.toLowerCase()) &&
                !ALLOWLIST.has(commenter.toLowerCase()) &&
                !signedSet.has(commenter.toLowerCase())
              ) {
                claData.signedContributors.push({
                  name: commenter,
                  id: commenterId,
                  comment_id: context.payload.comment.id,
                  created_at: new Date().toISOString(),
                  repoId: context.payload.repository?.id || 0,
                  pullRequestNo: prNumber,
                });
                signedSet.add(commenter.toLowerCase());
                newlySigned = true;

                const content = Buffer.from(`${JSON.stringify(claData, null, 2)}\n`, 'utf8').toString('base64');
                const updateParams = {
                  owner,
                  repo,
                  path: CLA_PATH,
                  branch: CLA_BRANCH,
                  message: `docs(cla): record CLA signature for @${commenter} (PR #${prNumber})`,
                  content,
                };
                if (fileSha) {
                  updateParams.sha = fileSha;
                }
                await github.rest.repos.createOrUpdateFileContents(updateParams);
                core.info(`Recorded CLA signature for @${commenter} on ${CLA_BRANCH}:${CLA_PATH}`);
              }
            }

            // Collect all PR commit authors (and PR author)
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const contributors = new Map();
            const prAuthor = String(pr.user?.login || '').trim();
            if (prAuthor) {
              contributors.set(prAuthor.toLowerCase(), prAuthor);
            }
            for (const item of commits) {
              const login = String(item.author?.login || '').trim();
              if (login) {
                contributors.set(login.toLowerCase(), login);
              }
            }

            const unsigned = [];
            for (const [low, display] of contributors.entries()) {
              if (!ALLOWLIST.has(low) && !signedSet.has(low)) {
                unsigned.push(display);
              }
            }

            // Find any existing CLA bot comment on this PR
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(MARKER));

            if (unsigned.length === 0) {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body: `${MARKER}\n✅ All contributors have signed the **W5CDN RadioPlanner** Contributor License Agreement.`,
                });
              }
              core.info('All PR contributors are allowlisted or have signed the CLA.');

              // If triggered via comment, re-run the latest pull_request_target CLA workflow so the PR check updates
              if (context.eventName === 'issue_comment' && newlySigned) {
                const { data: runs } = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: 'cla.yml',
                  event: 'pull_request_target',
                  per_page: 20,
                });
                const matching = (runs.workflow_runs || []).find(
                  (r) => r.head_sha === pr.head.sha && r.status === 'completed' && r.conclusion !== 'success'
                );
                if (matching) {
                  await github.rest.actions.reRunWorkflow({
                    owner,
                    repo,
                    run_id: matching.id,
                  });
                  core.info(`Re-triggered CLA workflow run ${matching.id} for PR #${prNumber}`);
                }
              }
              return;
            }

            const mentions = unsigned.map((u) => `@${u}`).join(', ');
            const commentBody = [
              MARKER,
              `Thank you for your pull request and interest in contributing to **W5CDN RadioPlanner**!`,
              '',
              `Before we can merge this PR, the following contributor(s) must sign our [Contributor License Agreement (CLA)](${CLA_DOC_URL}): ${mentions}`,
              '',
              `Please post a new comment on this PR containing the exact text:`,
              '',
              '```text',
              SIGN_PHRASE,
              '```',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }

            core.setFailed(`CLA signature required from: ${unsigned.join(', ')}`);
