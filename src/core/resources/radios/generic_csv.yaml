id: "generic_csv"
brand: "Generic"
model: "CSV Exporter"
description: "Generic CSV format compatible with standard spreadsheet editors"
maxChannels: 5000
maxNameLength: 32
allowDots: true
allowSpaces: true
allowedSpecialChars: " -_./#()[]"
programmerType: "GENERIC_CSV"
supportedBands:
  - "10m"
  - "6m"
  - "2m"
  - "1.25m"
  - "70cm"
  - "GMRS"
  - "Airband"
  - "WX"
supportedModes:
  - "FM"
  - "AM"
  - "DMR"
  - "ANALOG"
  - "DIGITAL"
columns:
  - "Channel Number"
  - "Name"
  - "Receive Frequency"
  - "Transmit Frequency"
  - "Offset"
  - "Offset Direction"
  - "Mode"
  - "Power"
  - "Tone Mode"
  - "CTCSS"
  - "Rx CTCSS"
  - "DCS"
  - "Rx DCS"
  - "DCS Polarity"
  - "Bandwidth"
  - "City"
  - "State"
  - "Latitude"
  - "Longitude"
  - "Comment"
