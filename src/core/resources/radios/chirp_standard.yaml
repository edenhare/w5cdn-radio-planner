id: "chirp_standard"
brand: "Generic"
model: "CHIRP Standard"
description: "Universal CHIRP CSV format for UV-5R, DM-32UV, and generic radios"
maxChannels: 1000
maxNameLength: 16
allowDots: true
allowSpaces: true
allowedSpecialChars: " -_./+#*"
programmerType: "CHIRP"
supportedBands:
  - "10m"
  - "6m"
  - "2m"
  - "1.25m"
  - "70cm"
  - "GMRS"
  - "Airband"
  - "WX"
supportedModes:
  - "FM"
  - "AM"
  - "DMR"
  - "ANALOG"
  - "DIGITAL"
columns:
  - "Location"
  - "Name"
  - "Frequency"
  - "Duplex"
  - "Offset"
  - "Mode"
  - "Tone"
  - "rToneFreq"
  - "cToneFreq"
  - "DtcsCode"
  - "DtcsPolarity"
  - "RxDtcsCode"
  - "CrossMode"
  - "Mode2"
  - "Power"
  - "Skip"
  - "Comment"
  - "URCALL"
  - "RPT1CALL"
  - "RPT2CALL"
  - "Digital Code"
