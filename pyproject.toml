[project]
name = "radioplanner"
version = "0.2.0"
description = "W5CDN RadioPlanner — Travel Corridor, Proximity & Aviation Radio Codeplug Cockpit"
authors = [
    { name = "RadioPlanner Team" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.1",
    "pydantic>=2.6.4",
    "ruamel.yaml>=0.18.6",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
    "pywebview>=5.3; sys_platform == 'win32' or sys_platform == 'darwin'",
]

[project.scripts]
radioplanner = "cli.main:main"
w5cdn-radio-planner = "web.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/cli", "src/web"]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "poethepoet>=0.25.0",
    "ruff>=0.3.4",
]
ui = [
    "axe-playwright-python>=0.1.5",
    "playwright>=1.50.0",
]
packaging = [
    "pyinstaller>=6.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
markers = [
    "ui: Playwright real-browser UI E2E and WCAG accessibility tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.poe.tasks]
test = "pytest"
test-cov = "pytest --cov=core --cov=cli --cov=web --cov-report=term-missing --cov-report=html"
lint = "ruff check src scripts tests"
format = "ruff format src scripts tests"
check = ["lint", "test"]
run = "python -m cli.main"
desktop = "python -m web.desktop"
