[project]
name = "radioplanner"
version = "0.1.0"
description = "RadioPlanner - Travel Corridor and Proximity Radio Codeplug Generator"
authors = [
    { name = "RadioPlanner Team" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.1",
    "pydantic>=2.6.4",
    "ruamel.yaml>=0.18.6",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
]

[project.scripts]
radioplanner = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/cli", "src/web"]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "poethepoet>=0.25.0",
    "ruff>=0.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.poe.tasks]
test = "pytest"
test-cov = "pytest --cov=core --cov=cli --cov-report=term-missing --cov-report=html"
lint = "ruff check src tests"
format = "ruff format src tests"
check = ["lint", "test"]
run = "python -m cli.main"
